name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk talking-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: talking-tv-apk
          path: talking-tv.apk

      - name: Publish as the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest talking-tv.apk \
            --target "${{ github.sha }}" \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Install talking-tv.apk on the TV. See the README for steps. Built from ${{ github.sha }}."
